[package]
name = "sweet-search-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["default"] }
napi-derive = "2"
rayon = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
