name: CI

on:
  # CI push runs are disabled until the private-repo Actions spending limit is
  # fixed. GitHub currently fails these before step 1 with:
  # "recent account payments have failed or your spending limit needs to be
  # increased", which only spams maintainers and does not exercise the code.
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: node scripts/check-boundaries.js
      - run: npm test -- --run
