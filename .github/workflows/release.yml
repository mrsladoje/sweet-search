name: Release Build & Smoke Test

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      skip_publish:
        description: 'Skip npm publish (build and test only)'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Private repositories cannot publish npm provenance. Keep this explicit
  # so future npm/setup-node defaults cannot silently re-enable it.
  NPM_CONFIG_PROVENANCE: 'false'

jobs:
  # ─────────────────────────────────────────────────────
  # Build native CLI binary for each platform
  # ─────────────────────────────────────────────────────
  # Note: the CUDA variants of the Linux packages
  # (.github/workflows/publish-native-linux-{x64,arm64}-gnu-cuda.yml)
  # rebuild the CLI independently. Duplication is intentional — the
  # CUDA workflows are self-contained and do not depend on this job
  # graph.
  build-cli:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            platform: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            platform: darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-arm64-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux targets cross-compile against glibc 2.17 via cargo-zigbuild, so the
      # binary loads on ANY glibc >= 2.17 — Debian 11 (2.31), RHEL/Rocky 8 (2.28),
      # Amazon Linux 2 (2.26), and every newer distro. cargo-zigbuild also builds
      # the arm64 target from this x64 runner, so no QEMU/cross is needed.
      # (Pinned zig 0.16.0 + cargo-zigbuild 0.22.3 — the combo validated locally
      # to emit a glibc-2.17 addon that loads on Debian 11.)
      - name: Set up zig (Linux targets)
        if: contains(matrix.target, 'linux')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install cargo-zigbuild (Linux targets)
        if: contains(matrix.target, 'linux')
        run: cargo install cargo-zigbuild --version 0.22.3 --locked

      - name: Build CLI
        working-directory: crates/sweet-search-cli
        run: |
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            cargo zigbuild --release --target ${{ matrix.target }}.2.17
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: crates/sweet-search-cli/target/${{ matrix.target }}/release/sweet-search

  # ─────────────────────────────────────────────────────
  # Build native MaxSim addon for each platform
  # ─────────────────────────────────────────────────────
  # Native addon builds — host-native for darwin and linux-x64,
  # Docker arm64 container for linux-arm64 (no native runner available).
  #
  # Per-platform Cargo features:
  #   - Darwin: coreml,accelerate (Metal is on by default in our Cargo.toml;
  #     coreml + accelerate are opt-in features that the local
  #     `npm run build:native` script enables)
  #   - Linux x64 CPU-only: no extra features (CUDA is its own separate
  #     workflow at publish-native-linux-x64-gnu-cuda.yml)
  build-addon:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            platform: darwin-arm64
            features: '--features coreml,accelerate'
          - target: x86_64-apple-darwin
            os: macos-14
            platform: darwin-x64
            features: '--features coreml,accelerate'
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64-gnu
            features: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Darwin builds the addon natively with napi-rs. The Linux addon is the
      # cdylib .so built via cargo-zigbuild against glibc 2.17 and renamed to
      # *.node — portable to any glibc >= 2.17 (the napi exports work the same;
      # the resolver requires the .node directly). Pinned zig 0.16.0 +
      # cargo-zigbuild 0.22.3 (validated locally → glibc-2.17 addon loads on
      # Debian 11). napi-rs CLI is only needed for the darwin native build.
      - name: Set up zig (Linux)
        if: contains(matrix.target, 'linux')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install cargo-zigbuild (Linux)
        if: contains(matrix.target, 'linux')
        run: cargo install cargo-zigbuild --version 0.22.3 --locked
      - name: Install JS deps (darwin napi build)
        if: startsWith(matrix.platform, 'darwin')
        run: npm ci --ignore-scripts

      - name: Build addon
        working-directory: crates/sweet-search-native
        run: |
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            cargo zigbuild --release --target ${{ matrix.target }}.2.17
            cp "target/${{ matrix.target }}/release/libsweet_search_native.so" "sweet-search-native.${{ matrix.platform }}.node"
          else
            npx napi build --release --platform --target ${{ matrix.target }} ${{ matrix.features }}
          fi

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.platform }}
          path: crates/sweet-search-native/sweet-search-native.*.node

  # linux-arm64 addon — cross-compiled from the x64 runner against glibc 2.17
  # via cargo-zigbuild. Replaces the old QEMU-emulated Docker build: no emulation
  # (faster + no QEMU flakiness) and a much lower glibc floor (2.17 vs the old
  # 2.36), so the arm64 addon loads on Debian 11 / RHEL 8 / Amazon Linux 2 arm64
  # and every newer distro. Pinned zig 0.16.0 + cargo-zigbuild 0.22.3.
  build-addon-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.22.3 --locked

      - name: Build arm64 addon (glibc 2.17)
        working-directory: crates/sweet-search-native
        run: |
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.17
          cp "target/aarch64-unknown-linux-gnu/release/libsweet_search_native.so" sweet-search-native.linux-arm64-gnu.node
          ls -la sweet-search-native.linux-arm64-gnu.node
          file sweet-search-native.linux-arm64-gnu.node

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: addon-linux-arm64-gnu
          path: crates/sweet-search-native/sweet-search-native.linux-arm64-gnu.node

  # ─────────────────────────────────────────────────────
  # Build the OPTIONAL bg-priority N-API addon (darwin + linux)
  # ─────────────────────────────────────────────────────
  # Background-scheduling addon (macOS per-thread QOS_CLASS_BACKGROUND). It is a
  # best-effort optimization — os-priority.mjs falls back to spawn-based
  # taskpolicy/ionice/chrt + os.setPriority when a platform package is absent —
  # so its build + publish are isolated from the main release (see the separate
  # publish-bg-priority job). Darwin builds natively via napi-rs; linux via
  # cargo-zigbuild against glibc 2.17 (same portability floor as the maxsim
  # addon), renaming the cdylib .so to .node. Windows is intentionally not built
  # (no Windows runners; the spawn/os.setPriority fallback covers win32).
  build-bg-addon:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            platform: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            platform: darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up zig (Linux)
        if: contains(matrix.target, 'linux')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install cargo-zigbuild (Linux)
        if: contains(matrix.target, 'linux')
        run: cargo install cargo-zigbuild --version 0.22.3 --locked
      - name: Install JS deps (napi cli for darwin build)
        if: startsWith(matrix.platform, 'darwin')
        run: npm ci --ignore-scripts
      - name: Build bg-priority addon
        working-directory: native/bg-priority
        run: |
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            cargo zigbuild --release --target ${{ matrix.target }}.2.17
            cp "target/${{ matrix.target }}/release/libsweet_search_bg_priority.so" "sweet-search-bg-priority.${{ matrix.platform }}.node"
          else
            npx napi build --release --platform --target ${{ matrix.target }}
          fi
      - name: Upload bg-priority addon
        uses: actions/upload-artifact@v4
        with:
          name: bg-addon-${{ matrix.platform }}
          path: native/bg-priority/sweet-search-bg-priority.*.node

  # linux-arm64 bg-priority addon — cross-compiled from the x64 runner against
  # glibc 2.17 via cargo-zigbuild (same approach as build-addon-arm64).
  build-bg-addon-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --version 0.22.3 --locked
      - name: Build arm64 bg-priority addon (glibc 2.17)
        working-directory: native/bg-priority
        run: |
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.17
          cp "target/aarch64-unknown-linux-gnu/release/libsweet_search_bg_priority.so" sweet-search-bg-priority.linux-arm64-gnu.node
          ls -la sweet-search-bg-priority.linux-arm64-gnu.node
          file sweet-search-bg-priority.linux-arm64-gnu.node
      - name: Upload bg-priority addon
        uses: actions/upload-artifact@v4
        with:
          name: bg-addon-linux-arm64-gnu
          path: native/bg-priority/sweet-search-bg-priority.linux-arm64-gnu.node

  # ─────────────────────────────────────────────────────
  # Assemble platform packages and run smoke tests
  # ─────────────────────────────────────────────────────
  # Native smoke tests — run on the actual target platform
  smoke-test:
    needs: [build-cli, build-addon]
    strategy:
      # Don't cancel sibling platform legs when one fails — we need each
      # platform's full result (darwin-x64 runs under Rosetta and was being
      # cancelled before it could report).
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # NOTE: there is intentionally no darwin-x64 smoke leg. GitHub's macOS
      # runners are Apple Silicon (macos-14+), so a "darwin-x64" leg could only
      # run under Rosetta emulation, where native Metal/ORT inference fails — it
      # cannot meaningfully exercise the x64 native path, and Apple ships no new
      # Intel Macs. The x64 darwin addon is still cross-built + published by
      # build-addon; the x64 native code path is covered by the linux-x64 leg
      # and the macOS native path by darwin-arm64.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: cli-${{ matrix.platform }}
          path: packages/native-${{ matrix.platform }}/

      - name: Download addon
        uses: actions/download-artifact@v4
        with:
          name: addon-${{ matrix.platform }}
          path: packages/native-${{ matrix.platform }}/

      - name: Rename addon and prepare binaries
        run: |
          cd packages/native-${{ matrix.platform }}
          mv sweet-search-native.*.node sweet-search-native.node 2>/dev/null || true
          chmod +x sweet-search
          ls -la

      - name: Ad-hoc sign macOS binaries
        if: startsWith(matrix.platform, 'darwin')
        run: |
          codesign -s - -f packages/native-${{ matrix.platform }}/sweet-search
          codesign -s - -f packages/native-${{ matrix.platform }}/sweet-search-native.node

      # Note: NOT using --ignore-scripts here because the unit/integration
      # tests below require better-sqlite3 and onnxruntime-node native
      # bindings, which are downloaded/built by their postinstall hooks.
      # Without postinstall, every SQLite/ONNX-touching test fails (saw
      # this on the v2.3.0 run: 37/45 schema tests, 38/39 phase5-artifacts,
      # 13/13 indexer-vectors all crashed at addon load).
      - name: Install dependencies
        run: npm ci

      # Warm the GLOBAL model cache (~/.cache/sweet-search/models) before the
      # test suite. The streaming-vectors integration test runs the indexer's
      # native path, which assumes tokenizer.json is already on disk and does
      # NOT fetch it on demand; and the init --profile full test otherwise
      # downloads models inside its 30s timeout. Pre-fetching via init (the
      # registry-backed path that does download tokenizer.json) makes both run
      # for real instead of failing on a cold cache.
      - name: Pre-fetch models (warm cache for integration tests)
        run: |
          mkdir -p "$RUNNER_TEMP/ss-prefetch"
          echo '{"name":"ss-prefetch"}' > "$RUNNER_TEMP/ss-prefetch/package.json"
          # init --profile full warms the embedding stack (it downloads the
          # CodeRankEmbed-onnx-int8 tokenizer + FP32 weights). It does more than
          # download (runtime verify, hook registration) and can exit non-zero in
          # a bare temp dir, so tolerate its exit code.
          SWEET_SEARCH_PROJECT_ROOT="$RUNNER_TEMP/ss-prefetch" node scripts/init.js --profile full \
            || echo "init returned non-zero — continuing to explicit LI fetch"
          # init selects the *edge* LI variant, but the native indexer loads the
          # STANDARD lightonai/LateOn-Code, so fetch that registry entry directly
          # (otherwise streaming-vectors aborts: "[NativeTokenizer] tokenizer.json
          # not found .../lightonai--LateOn-Code/tokenizer.json" on a cold cache).
          node -e "import('./core/infrastructure/model-fetcher.js').then((m) => m.fetchModel('lateon-code', { allowDownload: true })).then((r) => console.log('lateon-code: downloaded ' + r.downloaded + ', cached ' + r.cached)).catch((e) => { console.error(e); process.exit(1); })"
          # The integration tests need these tokenizers on disk for the native
          # path; fail loudly if either is absent.
          test -f "$HOME/.cache/sweet-search/models/mrsladoje--CodeRankEmbed-onnx-int8/tokenizer.json"
          test -f "$HOME/.cache/sweet-search/models/lightonai--LateOn-Code/tokenizer.json"
          echo "model cache warmed: tokenizers present"
        env:
          SWEET_SEARCH_TEST_DOWNLOADS: '1'
          # HF 403s anonymous downloads from runner IPs (the 2.7.0 release
          # failed twice here). model-fetcher sends this only to huggingface.co.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Run unit tests
        run: npm test -- --run

      - name: Smoke test (core profile)
        run: node scripts/smoke-test.js --profile core

      - name: Smoke test (full profile)
        run: node scripts/smoke-test.js --profile full
        env:
          SWEET_SEARCH_TEST_DOWNLOADS: '1'

      - name: Native launcher integration (warm path)
        run: npm test -- --run tests/integration/native-launcher.integration.test.js

  # linux-arm64 runtime smoke under QEMU is intentionally not on the release
  # critical path. The arm64 addon is already compiled inside an arm64 Docker
  # container and checked with `file`/glibc diagnostics in build-addon-arm64.
  # The old full smoke job performed another arm64 npm install + model init
  # under QEMU and repeatedly exhausted private-repo Actions spending before
  # a runner could even start the job. Keeping publish dependent on the build
  # artifact, not this QEMU smoke, makes tag releases deterministic.

  # ─────────────────────────────────────────────────────
  # Packaging verification
  # ─────────────────────────────────────────────────────
  pack-verify:
    needs: [build-cli, build-addon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify manifest is up to date
        run: node scripts/generate-asset-manifest.js --check

      - name: Verify npm pack contents
        run: npm pack --dry-run 2>&1 | tee pack-output.txt

      - name: Run packaging tests
        run: npm test -- --run tests/integration/packaging.test.js

      - name: Check tarball size
        run: |
          npm pack 2>/dev/null
          ls -lh sweet-search-*.tgz
          SIZE=$(stat --printf="%s" sweet-search-*.tgz 2>/dev/null || stat -f "%z" sweet-search-*.tgz)
          echo "Tarball size: $SIZE bytes"
          # Warn if main package exceeds 5MB (without models)
          if [ "$SIZE" -gt 5242880 ]; then
            echo "::warning::Main package tarball exceeds 5MB ($SIZE bytes)"
          fi

  # ─────────────────────────────────────────────────────
  # Portability gate — the linux-x64 addon MUST load on an OLD glibc.
  # ─────────────────────────────────────────────────────
  # The smoke-test runs on ubuntu-latest (same glibc the addon is built against),
  # so it can never catch a glibc-too-new regression. This job loads the built
  # addon inside Debian 11 (glibc 2.31) — the lowest common server glibc — and
  # fails the release if it can't load. This is the gate that would have caught
  # the GLIBC_2.39 breakage shipped in 2.5.2/2.5.3.
  glibc-portability-check:
    needs: build-addon
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: addon-linux-x64-gnu
          path: ./addon
      - name: Load linux-x64 addon on Debian 11 (glibc 2.31)
        run: |
          cp "$(ls ./addon/*.node | head -1)" ./addon/test.node
          docker run --rm -v "$PWD/addon:/a" node:20-bullseye \
            node -e "const m=require('/a/test.node'); if (typeof m.NativeTokenizer?.fromFile !== 'function') { console.error('addon loaded but missing NativeTokenizer.fromFile'); process.exit(1); } console.log('OK: linux-x64 addon loads + exports NativeTokenizer on glibc 2.31 (Debian 11)');"

  # ─────────────────────────────────────────────────────
  # Publish (only on tag push, unless skip_publish)
  # ─────────────────────────────────────────────────────
  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.skip_publish != 'true'
    needs: [smoke-test, build-addon-arm64, pack-verify, glibc-portability-check]
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      # Download all platform artifacts
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Assemble platform packages
        run: |
          # Show what's actually in each artifact dir for debuggability —
          # if a future build produces an unexpected file count this surfaces it.
          for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu; do
            echo "--- artifacts/addon-$platform ---"
            ls -la "artifacts/addon-$platform/"
          done

          for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu; do
            dir="packages/native-$platform"
            cp "artifacts/cli-$platform/sweet-search" "$dir/sweet-search"
            # Use the explicit platform-suffixed filename. Globbing
            # sweet-search-native.*.node failed when napi-rs cross-compilation
            # for darwin-x64 on a macos-14 (arm64) host produced more than one
            # .node file — `cp` with 3+ args treats the last as a directory
            # and errored "is not a directory". The explicit filename matches
            # napi-rs's --platform output exactly.
            cp "artifacts/addon-$platform/sweet-search-native.$platform.node" "$dir/sweet-search-native.node"
            chmod +x "$dir/sweet-search"
          done

          # Re-sign Darwin artifacts after copying them into the package directories.
          # This matches the smoke-test path and avoids invalid Mach-O signatures.
          codesign -s - -f packages/native-darwin-arm64/sweet-search
          codesign -s - -f packages/native-darwin-arm64/sweet-search-native.node
          codesign -s - -f packages/native-darwin-x64/sweet-search
          codesign -s - -f packages/native-darwin-x64/sweet-search-native.node

      # Publish order: platform packages first, then main package
      - name: Publish platform packages
        run: |
          for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu; do
            cd "packages/native-$platform"
            npm publish --access public
            cd ../..
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ─────────────────────────────────────────────────────
  # Publish the OPTIONAL bg-priority addon packages (isolated, non-blocking)
  # ─────────────────────────────────────────────────────
  # Deliberately a SEPARATE job from `publish` (not in its needs, and `publish`
  # is not in its needs): bg-priority is an optional, best-effort optimization,
  # so a bg-priority build/publish failure must NEVER block the main 2.6.x
  # release. The per-platform packages are optionalDependencies of the base
  # @sweet-search/bg-priority, which is itself an optionalDependency of the main
  # package — unresolved optionals are non-fatal at install (os-priority.mjs
  # falls back to the spawn-based levers). Per-platform are published first, then
  # the base that references them. Runs on the same release gates as `publish`.
  publish-bg-priority:
    if: startsWith(github.ref, 'refs/tags/v') && github.event.inputs.skip_publish != 'true'
    needs: [smoke-test, pack-verify, glibc-portability-check, build-bg-addon, build-bg-addon-arm64]
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Assemble bg-priority packages
        run: |
          for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu; do
            echo "--- artifacts/bg-addon-$platform ---"
            ls -la "artifacts/bg-addon-$platform/"
            cp "artifacts/bg-addon-$platform/sweet-search-bg-priority.$platform.node" "packages/bg-priority-$platform/sweet-search-bg-priority.$platform.node"
          done
          # Ad-hoc sign the darwin addons (matches the native publish path).
          codesign -s - -f packages/bg-priority-darwin-arm64/sweet-search-bg-priority.darwin-arm64.node
          codesign -s - -f packages/bg-priority-darwin-x64/sweet-search-bg-priority.darwin-x64.node
      - name: Publish bg-priority packages (per-platform first, then base)
        run: |
          for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu; do
            cd "packages/bg-priority-$platform"
            npm publish --access public
            cd ../..
          done
          cd native/bg-priority
          npm publish --access public
          cd ../..
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
