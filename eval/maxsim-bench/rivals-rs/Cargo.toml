[package]
name = "rivals-rs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "rivals_rs"
crate-type = ["cdylib"]

[features]
default = []
accelerate = ["next-plaid/accelerate"]
openblas = ["next-plaid/openblas"]

[dependencies]
next-plaid = { version = "=1.8.5", default-features = false }
numkong = { version = "=7.8.5" }
rayon = "1"
ndarray = "0.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
