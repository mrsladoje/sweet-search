[package]
name = "ss-grep-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ss-grep's output logic in Rust: the same bytes as the JS tool (core/agent-tools/run-agent-tool.mjs cmdGrep), for the native lane"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
