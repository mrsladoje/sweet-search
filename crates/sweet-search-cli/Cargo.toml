[package]
name = "sweet-search-cli"
version = "0.1.0"
edition = "2021"
description = "Native CLI launcher for Sweet Search (Unix socket client)"

[[bin]]
name = "sweet-search"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
