[package]
name = "sweet-search-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
memmap2 = "0.9"
napi = { version = "2", features = ["default"] }
napi-derive = "2"
rayon = "1"
memchr = "2"
regex = "1"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
napi-build = "2"

[features]
default = []
metal = ["candle-transformers/metal"]
# accelerate = vDSP/AMX acceleration for candle CPU-side paths (shape bookkeeping,
# small reductions, token_type_embeddings assembly). Enabled by default on macOS
# so the Metal path benefits from Accelerate/AMX on the small CPU-side ops that
# still fall through to CPU. ~1.02-1.05x free win on macOS.
accelerate = ["candle-core/accelerate"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
