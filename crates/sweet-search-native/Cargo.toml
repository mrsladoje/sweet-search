[package]
name = "sweet-search-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candle-core = "0.10"
candle-nn = "0.10"
candle-transformers = "0.10"
# candle-flash-attn is needed as a DIRECT dependency (not just transitive
# through candle-transformers/flash-attn) because src/inference/varlen.rs
# calls candle_flash_attn::flash_attn_varlen_windowed by name. Without
# this entry the crate is invisible to our code even when the
# `flash-attn` feature is on. Optional + gated through the feature so
# non-CUDA builds don't pull it in.
candle-flash-attn = { version = "0.10", optional = true }
memmap2 = "0.9"
napi = { version = "2", features = ["default"] }
napi-derive = "2"
rayon = "1"
memchr = "2"
regex = "1"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
sha1 = "0.10"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
napi-build = "2"
# cc is used only when the `coreml` feature is on, to compile the small
# Objective-C shim (src/inference/coreml_shim.m) that wraps Apple's
# CoreML framework. Rust calls into the shim through a plain C ABI.
cc = "1"

[features]
default = []
metal = ["candle-transformers/metal"]
# coreml = Apple Neural Engine inference via a thin Objective-C shim that
# wraps the CoreML framework. Loads .mlpackage files, pins compute_units to
# CPU_AND_NE (the CoreML GPU path miscompiles our attention/MLP/norm chain
# and silently produces garbage — verified on both NomicBERT embed and
# ModernBERT LI in scripts/spike-coreml/test_coreml_*_parity.py). The shim
# requires the CoreML and Foundation frameworks at link time (handled by
# build.rs). Metal feature is required because CoreML is macOS-only.
coreml = ["metal"]
# accelerate = vDSP/AMX acceleration for candle CPU-side paths (shape bookkeeping,
# small reductions, token_type_embeddings assembly). Enabled by default on macOS
# so the Metal path benefits from Accelerate/AMX on the small CPU-side ops that
# still fall through to CPU. ~1.02-1.05x free win on macOS.
#
# APPLE-ONLY: `accelerate-src` links against the Accelerate framework
# (`cargo:rustc-link-lib=framework=Accelerate`) which only exists on
# macOS / iOS. Including this feature in a Linux build fails with
# "library kind `framework` is only supported on Apple targets". The
# `build:native:cuda*` npm scripts must NOT include this feature.
accelerate = ["candle-core/accelerate"]
# cuda = NVIDIA GPU inference via candle's CUDA backend (cudarc + candle-kernels).
# Linux-only at build time — requires CUDA 12.x toolkit + nvcc on PATH. At load
# time the built addon uses dynamic-linking through cudarc (libcuda.so / libcudart.so),
# so the `-cuda` native package must be installed on a host with a working NVIDIA
# driver; absence of libcuda.so at load is a hard error, NOT a graceful CPU fallback.
# This is why the cuda-enabled addon ships as a SEPARATE platform package
# (`@sweet-search/native-linux-{x64,arm64}-gnu-cuda`) rather than being bundled
# into the standard linux-*-gnu package. See docs/INIT_STRATEGY.md "CUDA Backend".
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
# cudnn = Optional cuDNN acceleration on top of the CUDA backend. Not currently
# required for correctness — candle's stock CUDA kernels handle the whole
# NomicBERT / ModernBERT forward path. Kept as an additive feature so a future
# release can enable it without a Cargo.toml churn.
cudnn = ["cuda", "candle-core/cudnn", "candle-nn/cudnn"]
# flash-attn = Fused scaled-dot-product-attention on CUDA via candle-flash-attn.
# Ampere+ only (SM 8.0+) — Turing and Volta fall through to the naive attention
# kernel which candle routes automatically. Compile cost adds ~5-10 minutes to a
# cold CUDA build and ~200 MB of intermediate object files; worth caching across
# CI jobs. Mirrors the fused SDPA path that Metal uses in nomic_bert_sdpa.rs and
# modernbert_sdpa.rs.
flash-attn = ["cuda", "candle-transformers/flash-attn", "dep:candle-flash-attn"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
