<svg xmlns="http://www.w3.org/2000/svg" fill="#1f2d6b" aria-label="How the index is built. Source files are chunked and enriched, embedded by two models, and stored compressed. That feeds six index parts: word index, n-gram index, binary HNSW, bi-encoder vectors, late-interaction vectors and code graph. The embedding runs on Apple Metal, the Apple Neural Engine, NVIDIA CUDA or any CPU. A maintainer daemon updates all six parts after each edit with an atomic swap." font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" shape-rendering="crispEdges" text-anchor="middle" viewBox="0 0 880 550"><path d="M6 0h868v6h6v538h-6v6H6v-6H0V6h6z"/><path fill="#f3f5fb" d="M12 6h856v6h6v526h-6v6H12v-6H6V12h6z"/><path fill="#93a5f0" d="M12 6h856v6H12z"/><path d="M170 52h203v74H170zm231 0h203v74H401zm231 0h203v74H632zM30 172h126v100H30zm136 0h126v100H166zm136 0h126v100H302zm136 0h126v100H438zm136 0h126v100H574zm136 0h126v100H710zM30 446h300v74H30zm340 0h300v74H370z"/><path fill="#7b88a3" d="M30 52h112v74H30zm0 270h192v74H30zm204 0h192v74H234zm204 0h192v74H438zm204 0h192v74H642zM146 88h13v2h-13zm13-4 7 5-7 5zm218 4h13v2h-13zm13-4 7 5-7 5zm218 4h13v2h-13zm13-4 7 5-7 5zm-351 42h2v22h-2zm231 0h2v22h-2zm231 0h2v22h-2zM92 147h682v2H92zm0 1h2v14h-2zm-4 14 5 7 5-7zm140-14h2v14h-2zm-4 14 5 7 5-7zm140-14h2v14h-2zm-4 14 5 7 5-7zm140-14h2v14h-2zm-4 14 5 7 5-7zm140-14h2v14h-2zm-4 14 5 7 5-7zm140-14h2v14h-2zm-4 14 5 7 5-7zM334 482h25v2h-25zm25-4 7 5-7 5zm315 4h6v2h-6zm10 0h6v2h-6zm10 0h6v2h-6zm10 0h6v2h-6zm10 0h6v2h-6zm10 0h6v2h-6zm10 0h6v2h-6zm10 0h6v2h-6zm10 0h6v2h-6zm10 0h6v2h-6zm10 0h6v2h-6zm10 0h6v2h-6zm10 0h6v2h-6zm10 0h6v2h-6zm10 0h6v2h-6zm10 0h6v2h-6zm10 0h6v2h-6zm10 0h6v2h-6zm5-256h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm0 10h2v6h-2zm-4-254h6v2h-6zm-2-4-7 5 7 5z"/><path fill="#f3f5fb" d="M33 55h106v68H33zm0 270h186v68H33zm204 0h186v68H237zm204 0h186v68H441zm204 0h186v68H645z"/><path fill="#fff" d="M173 55h197v68H173zm231 0h197v68H404zm231 0h197v68H635zM33 175h120v94H33zm136 0h120v94H169zm136 0h120v94H305zm136 0h120v94H441zm136 0h120v94H577zm136 0h120v94H713zM33 449h294v68H33z"/><path fill="#dff5ea" d="M373 449h294v68H373z"/><g style="font-size:13px;font-weight:800"><text x="86" y="84">Source files</text><text x="271" y="78">① Chunk + enrich</text><text x="502" y="78">② Embed, two models</text><text x="733" y="78">③ Store, compressed</text><text x="93" y="200">Word index</text><text x="229" y="200">n-gram index</text><text x="365" y="200">Binary HNSW</text><text x="501" y="200">Bi-encoder</text><text x="637" y="200">Late interaction</text><text x="773" y="200">Code graph</text><text x="126" y="348">Apple Metal</text><text x="330" y="348">Apple Neural Engine</text><text x="534" y="348">NVIDIA CUDA</text><text x="738" y="348">Any CPU</text><text x="180" y="472">Maintainer daemon</text><text x="520" y="472">Atomic swap</text></g><g style="font-size:11px;fill:#7b88a3"><text x="86" y="104">your working tree</text><text x="271" y="98">tree-sitter or regex rules</text><text x="271" y="114">path, scope, siblings, imports</text><text x="502" y="98">bi-encoder · 1 vector per chunk</text><text x="502" y="114">late interaction · 1 per token</text><text x="733" y="98">sign bits · INT8 · float32</text><text x="733" y="114">INT4 for the token vectors</text><text x="93" y="220">BM25F over FTS5</text><text x="93" y="236">name 10× · sig. 5×</text><text x="93" y="252">CPU · SQLite</text><text x="229" y="220">sparse grams</text><text x="229" y="236">posting lists, mmap</text><text x="229" y="252">CPU · Rust</text><text x="365" y="220">graph over 64-byte</text><text x="365" y="236">sign-bit codes</text><text x="365" y="252">~100 µs · ~1,000 hits</text><text x="501" y="220">float32 vectors, mmap</text><text x="501" y="236">+ INT8 copy</text><text x="501" y="252">exact rescore</text><text x="637" y="220">INT4 token vectors</text><text x="637" y="236">1.34 GiB → 396 MiB</text><text x="637" y="252">MaxSim rerank</text><text x="773" y="220">nodes + typed edges</text><text x="773" y="236">PageRank column</text><text x="773" y="252">CPU · SQLite</text><text x="126" y="368">own fused attention kernel</text><text x="126" y="384">BF16 · M1 and later</text><text x="330" y="368">CoreML cascade, M3 and later</text><text x="330" y="384">18% faster full index</text><text x="534" y="368">candle + flash attention</text><text x="534" y="384">x86-64 and Jetson / Grace</text><text x="738" y="368">ONNX Runtime, INT8 weights</text><text x="738" y="384">batches sized to the CPU cache</text><text x="180" y="492">watches the working tree</text><text x="180" y="508">tick every 15 to 300 s · ≤ 2 s CPU</text><text x="520" y="492">all six parts, one pointer file</text><text x="520" y="508">an edit is searchable at the next tick</text></g><g style="font-size:11px;font-weight:700;letter-spacing:1.3px;fill:#7b88a3;text-anchor:start"><text x="30" y="38">HOW IT IS BUILT · ONE PASS, ON YOUR MACHINE</text><text x="30" y="308">WHERE THE EMBEDDING RUNS · PICKED AT START-UP</text><text x="30" y="432">KEPT CURRENT AS YOU EDIT</text></g></svg>