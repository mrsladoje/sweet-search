ngine</text><text x="534" y="375">NVIDIA CUDA</text><text x="738" y="375">Any CPU</text></g><g style="font-size:11px;fill:#7b88a3"><text x="86" y="105">your working tree</text><text x="277" y="98">tree-sitter or regex rules</text><text x="277" y="114">path, scope, siblings, imports</text><text x="508" y="98">bi-encoder · 1 vector per chunk</text><text x="508" y="114">late interaction · 1 per token</text><text x="739" y="98">sign bits · INT8 · float32</text><text x="739" y="114">INT4 for the token vectors</text><text x="93" y="250">BM25F over FTS5</text><text x="93" y="266">name 10× · sig. 5×</text><text x="93" y="282">CPU · SQLite</text><text x="229" y="250">sparse grams</text><text x="229" y="266">posting lists, mmap</text><text x="229" y="282">CPU · Rust</text><text x="365" y="250">graph over 64-byte</text><text x="365" y="266">sign-bit codes</text><text x="365" y="282">~100 µs · ~1,000 hits</text><text x="501" y="250">float32 vectors, mmap</text><text x="501" y="266">+ INT8 copy</text><text x="501" y="282">exact rescore</text><text x="637" y="250">INT4 token vectors</text><text x="637" y="266">~3× smaller</text><text x="637" y="282">MaxSim rerank</text><text x="773" y="250">nodes + typed edges</text><text x="773" y="266">PageRank column</text><text x="773" y="282">CPU · SQLite</text><text x="126" y="394">own fused attention kernel</text><text x="126" y="410">BF16 · M1 and later</text><text x="330" y="394">CoreML cascade, M3 and later</text><text x="330" y="410">faster full index builds</text><text x="534" y="394">candle + flash attention</text><text x="534" y="410">x86-64 and Jetson / Grace</text><text x="738" y="394">ONNX Runtime, INT8 weights</text><text x="738" y="410">batches sized to the CPU cache</text><text x="180" y="512">watches the working tree</text><text x="180" y="528">tick every 15 to 300 s · ≤ 2 s CPU</text><text x="532" y="512">all six indexes, one pointer file</text><text x="532" y="528">an edit is searchable at the next tick</text></g><text x="277" y="79" fill="#7c3aed" class="t">1 · Chunk + enrich</text><text x="508" y="79" fill="#db2777" class="t">2 · Embed, two models</text><text x="739" y="79" fill="#d97706" class="t">3 · Store, compressed</text><text x="433" y="154" fill="#fff" style="font-size:11px;font-weight:800;letter-spacing:.8px">SIX INDEXES</text><g fill="#fff" style="font-weight:800;letter-spacing:.8px;font-size:13px"><text x="93" y="200">1</text><text x="229" y="200">2</text><text x="365" y="200">3</text><text x="501" y="200">4</text><text x="637" y="200">5</text><text x="773" y="200">6</text></g><g class="t"><text x="93" y="230">Word index</text><text x="229" y="230">n-gram index</text><text x="365" y="230">Binary HNSW</text><text x="501" y="230">Bi-encoder</text><text x="637" y="230">Late interaction</text><text x="773" y="230">Code graph</text></g><text x="180" y="493" fill="#0891b2" class="t">Maintainer daemon</text><text x="532" y="493" fill="#0e9f6e" class="t">Atomic swap</text></svg>