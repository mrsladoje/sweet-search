<svg xmlns="http://www.w3.org/2000/svg" fill="#1f2d6b" aria-label="How the index is built. Source files are chunked and enriched, embedded by two models, and stored compressed. One pass feeds six indexes: 1 word index, 2 n-gram index, 3 binary HNSW, 4 bi-encoder vectors, 5 late-interaction vectors, 6 code graph. The embedding runs on Apple Metal, the Apple Neural Engine, NVIDIA CUDA or any CPU, picked automatically at start-up. A maintainer daemon updates all six indexes after each edit with an atomic swap." font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" shape-rendering="crispEdges" text-anchor="middle" viewBox="0 0 880 568"><style>.t{font-size:13px;font-weight:800}</style><path d="M6 0h868v6h6v556h-6v6H6v-6H0V6h6z"/><path fill="#f3f5fb" d="M12 6h856v6h6v544h-6v6H12v-6H6V12h6z"/><path fill="#ff5ba3" d="M155 6h142v6H155zM380 88h12v4h-12zm12-7h3v18h-3zm3 2h3v14h-3zm3 2h3v10h-3zm3 2h3v6h-3zm3 2h2v2h-2z"/><path fill="#ffc247" d="M297 6h143v6H297zM611 88h12v4h-12zm12-7h3v18h-3zm3 2h3v14h-3zm3 2h3v10h-3zm3 2h3v6h-3zm3 2h2v2h-2z"/><path fill="#2cc4dd" d="M583 6h142v6H583zM338 499h19v8h-19zm19-10h6v28h-6zm6 5h6v18h-6zm6 5h5v8h-5z"/><path fill="#7b88a3" d="M33 52h106v3h3v70h-3v3H33v-3h-3V55h3z"/><path fill="#7c3aed" d="M185 52h185v3h3v70h-3v3H185v-3h-3V55h3z"/><path fill="#db2777" d="M416 52h185v3h3v70h-3v3H416v-3h-3V55h3z"/><path fill="#d97706" d="M647 52h185v3h3v70h-3v3H647v-3h-3V55h3z"/><path d="M30 184h2v-3h3v-3h5v-2h8v-2h90v2h8v2h5v3h3v3h2v108h-2v3h-3v3h-5v2h-8v2H48v-2h-8v-2h-5v-3h-3v-3h-2zm136 0h2v-3h3v-3h5v-2h8v-2h90v2h8v2h5v3h3v3h2v108h-2v3h-3v3h-5v2h-8v2h-90v-2h-8v-2h-5v-3h-3v-3h-2zm136 0h2v-3h3v-3h5v-2h8v-2h90v2h8v2h5v3h3v3h2v108h-2v3h-3v3h-5v2h-8v2h-90v-2h-8v-2h-5v-3h-3v-3h-2zm136 0h2v-3h3v-3h5v-2h8v-2h90v2h8v2h5v3h3v3h2v108h-2v3h-3v3h-5v2h-8v2h-90v-2h-8v-2h-5v-3h-3v-3h-2zm136 0h2v-3h3v-3h5v-2h8v-2h90v2h8v2h5v3h3v3h2v108h-2v3h-3v3h-5v2h-8v2h-90v-2h-8v-2h-5v-3h-3v-3h-2zm136 0h2v-3h3v-3h5v-2h8v-2h90v2h8v2h5v3h3v3h2v108h-2v3h-3v3h-