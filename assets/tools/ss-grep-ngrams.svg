<svg xmlns="http://www.w3.org/2000/svg" aria-label="For the regex session.*expired, trigrams give 10 common pieces; sparse n-grams give 2 rare pieces, so far fewer files are left to check" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" shape-rendering="crispEdges" viewBox="0 0 880 174"><path fill="#1f2d6b" d="M6 0h868v6h6v162h-6v6H6v-6H0V6h6z"/><path fill="#f3f5fb" d="M12 6h856v6h6v150h-6v6H12v-6H6V12h6z"/><path fill="#ffc247" d="M12 6h856v6H12z"/><g fill="#7b88a3" font-size="11" font-weight="700" letter-spacing="1.3"><text x="30" y="36">HOW THE INDEX SPLITS</text><text x="626" y="36">FILES LEFT TO CHECK</text></g><text x="196" y="36" fill="#d97706" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700">session<tspan fill="#7b88a3">.*</tspan>expired</text><text x="30" y="65" fill="#1f2d6b" font-weight="800">Trigrams</text><text x="30" y="80" fill="#7b88a3" font-size="11">10 common pieces</text><clipPath id="a"><rect width="372" height="26" x="150" y="52"><animate attributeName="width" dur="5.8s" keyTimes="0;0.02;0.2;1" repeatCount="indefinite" values="0;0;372;372"/></rect></clipPath><g clip-path="url(#a)"><path fill="#1f2d6b" d="M150 52h33v26h-33zm36 0h33v26h-33zm36 0h33v26h-33zm36 0h33v26h-33zm36 0h33v26h-33zm48 0h33v26h-33zm36 0h33v26h-33zm36 0h33v26h-33zm36 0h33v26h-33zm36 0h33v26h-33z"/><g fill="#fff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><text x="155" y="69">ses</text><text x="191" y="69">ess</text><text x="227" y="69">ssi</text><text x="263" y="69">sio</text><text x="299" y="69">ion</text><text x="347" y="69">exp</text><text x="383" y="69">xpi</text><text x="419" y="69">pir</text><text x="455" y="69">ire</text><text x="491" y="69">red</text></g></g><path fill="#d97706" d="M626 52h12v10h-12zm72 0h12v10h-12zm54 0h12v10h-12zm72 0h12v10h-12zM662 68h12v10h-12zm72 0h12v10h-12zm54 0h12v10h-12z"><animate attributeName="opacity" dur="5.8s" keyTimes="0;0.2;0.27;